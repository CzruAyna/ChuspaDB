name: Validar SqlValidator y StringUtils
on:
  push:
    branches: [codex/validar-issues-14nov]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproducir el bloqueo de compilacion en dev
        shell: bash
        run: |
          mkdir -p classes
          if javac --release 17 -d classes src/main/java/edu/sisinf/estante/core/ErrorEstante.java > dev-compile.log 2>&1; then
            echo "La base ya no reproduce el error esperado"
            exit 1
          fi
          cat dev-compile.log
          grep -F 'class ErrorChuspaDB is public, should be declared in a file named ErrorChuspaDB.java' dev-compile.log
          echo '::notice title=Compilacion de dev::ErrorEstante.java declara la clase publica ErrorChuspaDB'
      - name: Ejecutar JUnit sobre las dos utilidades
        shell: bash
        run: |
          curl -fsSL -o junit.jar https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/6.1.3/junit-platform-console-standalone-6.1.3.jar
          echo 'e62b96ac475dbcde8599ea905d088f65d90778f86e259b856a49fa5c4ea256ec  junit.jar' | sha256sum --check
          javac --release 17 -encoding UTF-8 -cp junit.jar -d classes \
            src/main/java/edu/sisinf/estante/util/{SqlValidator,StringUtils}.java \
            src/test/java/edu/sisinf/estante/util/{SqlValidatorTest,StringUtilsTest}.java
          java -jar junit.jar execute --class-path classes --scan-class-path --disable-ansi-colors --details summary --fail-if-no-tests | tee junit.log
          count=$(grep 'tests successful' junit.log | tr -dc '0-9')
          echo "::notice title=JUnit::$count pruebas aprobadas"
